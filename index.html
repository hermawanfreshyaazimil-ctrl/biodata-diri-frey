<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Freshya Azimil Hermawan | Personal Profile</title>

    <meta name="description"
          content="Personal website of Freshya Azimil Hermawan.">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">


    <!-- =========================
         CSS
    ========================== -->

    <style>

        :root {
            --cream: #f5f1e8;
            --light-cream: #faf8f2;
            --white: #ffffff;
            --dark: #24231f;
            --muted: #77736b;
            --gold: #a68b5b;
            --border: #ddd7ca;
        }


        /* RESET */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--light-cream);
            color: var(--dark);
            font-family: "Inter", sans-serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           NAVIGATION
        ========================== */

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(250, 248, 242, 0.92);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(166, 139, 91, 0.2);
        }

        .nav-container {
            width: min(1180px, 90%);
            margin: auto;

            height: 75px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 3px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);

            transition: 0.3s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 100vh;

            width: min(1180px, 90%);
            margin: auto;

            display: grid;
            grid-template-columns: 1.2fr 0.8fr;

            align-items: center;

            gap: 80px;

            padding-top: 100px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 3px;

            color: var(--gold);

            font-weight: 600;

            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(70px, 9vw, 125px);

            font-weight: 500;

            line-height: 0.85;

            margin-bottom: 40px;
        }

        .hero h1 span {
            display: block;

            font-style: italic;

            color: var(--gold);
        }

        .hero-description {
            max-width: 560px;

            color: var(--muted);

            font-size: 16px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;

            margin-top: 35px;
        }

        .btn {
            padding: 13px 25px;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            transition: 0.3s;
        }

        .primary {
            background: var(--dark);
            color: white;
        }

        .primary:hover {
            background: var(--gold);
        }

        .secondary {
            border: 1px solid var(--dark);
        }

        .secondary:hover {
            background: var(--dark);
            color: white;
        }


        /* =========================
           PROFILE PHOTO
        ========================== */

        .hero-photo {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .photo-frame {
            width: min(380px, 100%);
            aspect-ratio: 3 / 4;

            padding: 14px;

            border: 1px solid var(--gold);

            position: relative;
        }

        .photo-frame::before {
            content: "";

            position: absolute;

            top: -12px;
            left: -12px;

            width: 70px;
            height: 70px;

            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .photo-caption {
            margin-top: 18px;

            text-align: center;
        }

        .photo-caption span {
            display: block;

            font-size: 10px;

            letter-spacing: 2px;

            font-weight: 600;
        }

        .photo-caption small {
            color: var(--muted);

            font-size: 11px;
        }


        /* =========================
           SECTION
        ========================== */

        .gold-line {
            width: 90%;
            max-width: 1180px;

            height: 1px;

            background: var(--gold);

            margin: auto;

            opacity: 0.4;
        }

        .section {
            width: min(1180px, 90%);

            margin: auto;

            padding: 130px 0;
        }

        .cream-section {
            width: 100%;

            padding-left: max(5%, calc((100% - 1180px) / 2));
            padding-right: max(5%, calc((100% - 1180px) / 2));

            background: var(--cream);
        }

        .section-heading {
            display: flex;

            align-items: baseline;

            gap: 20px;

            margin-bottom: 70px;
        }

        .section-heading span {
            color: var(--gold);

            font-size: 12px;

            letter-spacing: 2px;
        }

        .section-heading h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(45px, 6vw, 75px);

            font-weight: 500;
        }


        /* =========================
           ABOUT
        ========================== */

        .about-grid {
            display: grid;

            grid-template-columns: 1.3fr 0.7fr;

            gap: 100px;
        }

        .large-text {
            font-family: "Cormorant Garamond", serif;

            font-size: 32px;

            line-height: 1.3;

            margin-bottom: 30px;
        }

        .about-text p:not(.large-text) {
            color: var(--muted);

            margin-bottom: 20px;
        }


        /* BIO CARD */

        .bio-card {
            border-top: 1px solid var(--border);
        }

        .bio-row {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 18px 0;

            border-bottom: 1px solid var(--border);
        }

        .bio-row span {
            color: var(--muted);

            font-size: 12px;
        }

        .bio-row strong {
            text-align: right;

            font-size: 12px;
        }


        /* =========================
           EDUCATION
        ========================== */

        .timeline {
            border-left: 1px solid var(--gold);

            padding-left: 40px;
        }

        .timeline-item {
            position: relative;

            display: grid;

            grid-template-columns: 180px 1fr;

            gap: 40px;

            padding-bottom: 60px;
        }

        .timeline-item::before {
            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--gold);

            left: -45px;

            top: 7px;
        }

        .timeline-year {
            color: var(--gold);

            font-size: 12px;

            letter-spacing: 1px;
        }

        .timeline-content h3 {
            font-family: "Cormorant Garamond", serif;

            font-size: 32px;
        }

        .timeline-content p {
            color: var(--muted);
        }

        .timeline-content span {
            font-size: 12px;

            color: var(--gold);
        }


        /* =========================
           ACTIVITY CARDS
        ========================== */

        .cards {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
        }

        .card {
            border: 1px solid var(--border);

            padding: 35px 25px;

            min-height: 280px;

            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-8px);

            border-color: var(--gold);

            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        .card-number {
            color: var(--gold);

            font-size: 12px;

            margin-bottom: 45px;
        }

        .card h3 {
            font-family: "Cormorant Garamond", serif;

            font-size: 30px;

            margin-bottom: 15px;
        }

        .card p {
            font-size: 13px;

            color: var(--muted);
        }


        /* =========================
           ACHIEVEMENTS
        ========================== */

        .achievement-list {
            max-width: 850px;
        }

        .achievement {
            display: grid;

            grid-template-columns: 70px 1fr;

            gap: 30px;

            padding: 35px 0;

            border-bottom: 1px solid var(--border);
        }

        .achievement > span {
            color: var(--gold);

            font-size: 12px;
        }

        .achievement h3 {
            font-family: "Cormorant Garamond", serif;

            font-size: 32px;
        }

        .achievement p {
            color: var(--muted);
        }


        /* =========================
           LANGUAGES
        ========================== */

        .language-grid {
            max-width: 800px;
        }

        .language {
            margin-bottom: 35px;
        }

        .language-top {
            display: flex;

            justify-content: space-between;

            margin-bottom: 10px;
        }

        .language-top h3 {
            font-family: "Cormorant Garamond", serif;

            font-size: 25px;
        }

        .language-top span {
            font-size: 11px;

            color: var(--muted);
        }

        .progress {
            height: 2px;

            background: var(--border);
        }

        .progress-fill {
            height: 100%;

            background: var(--gold);

            animation: grow 1.5s ease forwards;
        }

        .full {
            width: 100%;
        }

        .english {
            width: 75%;
        }

        .french {
            width: 35%;
        }

        @keyframes grow {

            from {
                width: 0;
            }

        }


        /* =========================
           INTERESTS
        ========================== */

        .interest-list {
            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }

        .interest-list span {
            border: 1px solid var(--border);

            padding: 13px 22px;

            font-size: 12px;

            transition: 0.3s;
        }

        .interest-list span:hover {
            background: var(--dark);

            color: white;
        }


        /* =========================
           FUTURE SECTION
        ========================== */

        .future-section {
            min-height: 600px;

            display: flex;

            align-items: center;

            background:
                linear-gradient(
                    rgba(36,35,31,0.78),
                    rgba(36,35,31,0.78)
                ),
                url("future.jpg");

            background-size: cover;

            background-position: center;

            color: white;
        }

        .future-content {
            width: min(850px, 90%);

            margin: auto;
        }

        .future-content h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(55px, 8vw, 100px);

            font-weight: 400;

            line-height: 0.9;

            margin-bottom: 30px;
        }

        .future-content h2 em {
            color: #d5c39f;
        }

        .future-content p:last-child {
            max-width: 600px;

            color: #ddd;

            font-size: 15px;
        }


        /* =========================
           CONTACT
        ========================== */

        .contact-section {
            text-align: center;
        }

        .contact-section .section-heading {
            justify-content: center;
        }

        .contact-content > p {
            color: var(--muted);

            margin-bottom: 20px;
        }

        .email-link {
            font-family: "Cormorant Garamond", serif;

            font-size: clamp(28px, 5vw, 55px);

            border-bottom: 1px solid var(--gold);

            transition: 0.3s;
        }

        .email-link:hover {
            color: var(--gold);
        }

        .social-links {
            display: flex;

            justify-content: center;

            gap: 30px;

            margin-top: 45px;
        }

        .social-links a {
            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            color: var(--muted);

            transition: 0.3s;
        }

        .social-links a:hover {
            color: var(--gold);
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            background: var(--dark);

            color: white;

            padding: 40px 0;
        }

        .footer-inner {
            width: min(1180px, 90%);

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .footer-logo {
            font-family: "Cormorant Garamond", serif;

            font-size: 25px;

            letter-spacing: 3px;
        }

        .footer-inner p {
            font-size: 10px;

            color: #aaa;
        }


        /* =========================
           ANIMATION
        ========================== */

        .reveal {
            opacity: 0;

            transform: translateY(30px);

            transition: all 0.8s ease;
        }

        .reveal.active {
            opacity: 1;

            transform: translateY(0);
        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 900px) {

            .hero {
                grid-template-columns: 1fr;

                text-align: center;

                padding-top: 140px;
            }

            .hero-description {
                margin: auto;
            }

            .hero-buttons {
                justify-content: center;
            }

            .hero-photo {
                max-width: 400px;

                margin: auto;
            }

            .about-grid {
                grid-template-columns: 1fr;

                gap: 60px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 650px) {

            nav {
                position: absolute;

                top: 75px;

                left: 0;

                width: 100%;

                display: none;

                flex-direction: column;

                padding: 25px;

                background: var(--light-cream);

                border-bottom: 1px solid var(--border);
            }

            nav.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }

            .hero {
                min-height: auto;

                padding-bottom: 100px;
            }

            .hero h1 {
                font-size: 75px;
            }

            .section {
                padding: 90px 0;
            }

            .section-heading {
                margin-bottom: 45px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .timeline-item {
                grid-template-columns: 1fr;

                gap: 5px;
            }

            .achievement {
                grid-template-columns: 45px 1fr;

                gap: 15px;
            }

            .footer-inner {
                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

            .social-links {
                flex-wrap: wrap;
            }

        }

    </style>

</head>
